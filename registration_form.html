<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Registration Form</title>
    </head>
    <body>
        <form>
            <h1>Registration Form</h1>
            <div>
                <label for = "first_name_id">First Name:* </label>
                <input id = "first_name_id" type="text" name ="first_name" required>
            </div><br>
            <div>
                <label for ="last_name_id">Last Name:* </label>
                <input id = "last_name_id" type="text" name = "last_name" required>
            </div><br>
            <div>
                <label for = "email_id">Email Address:* </label>
                <input id = "email_id" type="email" name = "email" required>
            </div><br>
            <div>
                <label for = "password_id">Password:* </label>
                <input id = "password_id" type="password" name = "password" required>
            </div><br>
            <div>
                <label for = "confirm_password_id">Confirm Password:* </label>
                <input id = "confirm_password_id" type="password" name="confirm_password" required>
            </div><br>
            <div>
                <label for = "birthday_id">Birthday: </label>
                <input id = "birthday_id" type="date" name="birthday">
            </div><br>
            <div>
                <label>Gender Identity: </label><br>
                <input id = "male_id" type="radio" name="Gender" value="male"> 
                <label for="male_id">Male </label>
                <input id="female_id" type="radio" name="Gender" value="female"> 
                <label for="female_id">Female </label>
                <input id="none_binary_id" type="radio" name="Gender" value="none_binary">
                <label for="none_binary_id">None-binary </label>
                <input id ="no_answer_id" type="radio" name="Gender" value="no_answer">
                <label for="no_answer_id">I prefer not to answer </label>
            </div><br>

            <div>
                <label for = "description_id">A short description about my self: </label><br>
                <textarea id="description_id" name="comment" cols="32" rows="3"></textarea>
            </div><br>
            <div>
                <label for="favorite_id">Favorite Language: </label>
                <select id="favorite_id" name="language">
                    <option>JavaScript</option>
                    <option>HTML</option>
                    <option>CSS</option>
                </select>

            </div><br>
            <div>
                <input id = "check_id" type="checkbox" name="yes" value="yes" checked>
                <label for = "check_id">Yes, I would like to receive periodic email updates</label>
            </div><br>
            <div>
                <button type="submit">Create Account</button>
            </div><br>
            <p>* Indicates a required filed</p>
        </form>
    </body>
</html>
